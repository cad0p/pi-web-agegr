name: Auto Release

on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_changes: ${{ steps.release.outputs.has_changes }}
    steps:
      - id: release
        uses: cad0p/semver-calver-release/release@v1
        with:
          skip_release: ${{ github.ref != 'refs/heads/main' }}

  # The npm-publish action runs `npm install` + `npm publish`. pi-web ships
  # prebuilt Next.js output (the `.next/` dir, see `files` in package.json)
  # and `.next/` is gitignored, so a fresh checkout has no build artifacts.
  # The `prepublishOnly` script in package.json runs `next build` right
  # before publish — scoped to publish only, never on local installs/dev.
  publish:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: cad0p/semver-calver-release/npm-publish@v1
        with:
          tag: v${{ needs.release.outputs.version }}
